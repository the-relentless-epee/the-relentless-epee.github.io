# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Leon's Random Makes
author:
  name: "Leon Jiang"
  avatar: "/assets/images/bearing/bearing.jpg" # placeholder image
  bio: "Maker, engineer, and relentless tinkerer. I document my projects, builds, and the lessons learned along the way."
  location: "The workshop"
  email: "leonjiangzc@gmail.com"
  github: "the-relentless-epee"
  instagram: "leons_random_makes"
email: leonjiangzc@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Projects, builds, and lessons learned from tinkering in the workshop.

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://the-relentless-epee.github.io"
instagram_username: leons_random_makes
github_username:  the-relentless-epee

# Build settings
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Outputting
paginate: 5 # amount of posts to show
paginate_path: /page:num/

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap

# Default front matter for pages and posts.
# These values are used unless a file overrides them in its own front matter.
defaults:
  # Project blog posts live in _posts/
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      share: true
      related: true
      comments: true # requires a comments provider to actually render
      toc: true
      toc_sticky: true
  # Standalone pages (index.md, about.markdown, 404.html, ...)
  - scope:
      path: ""
      type: pages
    values:
      layout: single

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
